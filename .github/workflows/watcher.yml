# Programme watcher: every 2 h looks for new or changed programme PDFs, runs the data pipeline,
# commits dataset + report and deploys if publishable, and opens a GitHub issue (label 'vigilante') for each publication and failure.
# Manual relaunch of one party: Actions → "Manifesto watcher" → Run workflow.
# Secrets to set (Settings → Secrets and variables → Actions): see docs/deploy.md.
name: Manifesto watcher

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      party:
        description: 'Party id (empty = all)'
        required: false
        default: ''
      force:
        description: 'Process even if the PDF has not changed'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# Never two runs at once: both would commit and deploy the same dataset.
concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          # Astro is pinned to 7.4.1 for Node 22.23.2 (see docs/deploy.md).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configure git
        run: |
          git config user.name "29n-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Watch manifestos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_GATEWAY_URL: ${{ secrets.AI_GATEWAY_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          WATCHER_ASSIGNEE: ${{ github.repository_owner }}
          # Without it the deploy ships the site with analytics off (docs/deploy.md).
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          # "1" once the free question is open (docs/deploy.md); otherwise its deploys close the box again.
          PUBLIC_FREE_QUESTION: ${{ vars.PUBLIC_FREE_QUESTION }}
          PUSH: '1'
          PARTY: ${{ inputs.party }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$PARTY" ]; then args+=(--party "$PARTY"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          npx tsx scripts/watch.ts "${args[@]}"
      # The script notifies its own failures; this covers crashes before or outside it.
      - name: Alert if the job fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="29N: fallo del vigilante ($(date -u +%F))"
          gh label create vigilante --color 5319E7 --description 'Aviso del vigilante de programas' --force
          # One open issue per day at most: the cron runs every 2 h.
          open=$(gh issue list --label vigilante --state open --json title --jq "map(select(.title == \"$title\")) | length")
          [ "$open" = "0" ] || exit 0
          gh issue create --title "$title" --label vigilante --assignee "${{ github.repository_owner }}" \
            --body "El job del vigilante ha fallado: $RUN_URL"
