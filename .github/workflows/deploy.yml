# Deploy on merge to main. Which Worker depends on the data:
# - real dataset (origin "real") → production, `npm run deploy` (29n.jorgemasta.com);
# - simulated dataset → private, `npm run deploy:private` (29n-privado on workers.dev, never indexable),
#   because the production build refuses simulated data (src/launch/).
# The watcher's own commits don't trigger this: pushes made with the job's GITHUB_TOKEN start no
# workflow, and the watcher deploys by itself.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (docs/deploy.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer merge replaces a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Astro is pinned to 7.4.1 for Node 22.23.2 (see docs/deploy.md).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pick the Worker from the dataset
        id: target
        run: |
          origin=$(node -p "require('./data/dataset.json').origin")
          if [ "$origin" = "real" ]; then echo "script=deploy" >> "$GITHUB_OUTPUT"; else echo "script=deploy:private" >> "$GITHUB_OUTPUT"; fi
          echo "Dataset origin: $origin → npm run $( [ "$origin" = "real" ] && echo deploy || echo deploy:private )" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy (production)
        if: steps.target.outputs.script == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Without it the site ships with analytics off (docs/deploy.md).
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          # "1" once the free question is open (docs/deploy.md); otherwise a deploy closes the box again.
          PUBLIC_FREE_QUESTION: ${{ vars.PUBLIC_FREE_QUESTION }}
        run: npm run deploy
      # Private: no analytics (it would mix test visits into the real stats) and no free question.
      - name: Deploy (private)
        if: steps.target.outputs.script == 'deploy:private'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:private
