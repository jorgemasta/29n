# Programme watcher: every 2 h looks for new or changed programme PDFs, runs the data pipeline,
# commits dataset + report and deploys if publishable, and notifies the maintainer's phone (ntfy).
# Manual relaunch of one party: Actions → "Vigilante de programas" → Run workflow.
# Secrets to set (Settings → Secrets and variables → Actions): see docs/deploy.md.
name: Vigilante de programas

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      partido:
        description: 'Id del partido (vacío = todos)'
        required: false
        default: ''
      forzar:
        description: 'Procesar aunque el PDF no haya cambiado'
        type: boolean
        default: false

permissions:
  contents: write

# Never two runs at once: both would commit and deploy the same dataset.
concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          # Astro is pinned to 7.4.1 for Node 22.23.2 (see docs/deploy.md).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configurar git
        run: |
          git config user.name "29n-vigilante[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Vigilar programas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_GATEWAY_URL: ${{ secrets.AI_GATEWAY_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSH: '1'
          PARTIDO: ${{ inputs.partido }}
          FORZAR: ${{ inputs.forzar }}
        run: |
          args=()
          if [ -n "$PARTIDO" ]; then args+=(--partido "$PARTIDO"); fi
          if [ "$FORZAR" = "true" ]; then args+=(--forzar); fi
          npx tsx scripts/vigilar.ts "${args[@]}"
      # The script notifies its own failures; this covers crashes before or outside it.
      - name: Avisar si el job falla
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          auth=()
          if [ -n "$NTFY_TOKEN" ]; then auth=(-H "Authorization: Bearer $NTFY_TOKEN"); fi
          jq -n --arg t "$NTFY_TOPIC" --arg m "El job del vigilante ha fallado: $RUN_URL" \
            '{topic:$t, title:"29N: fallo del vigilante", message:$m, priority:4, tags:["warning"]}' \
            | curl -fsS "${auth[@]}" -H 'content-type: application/json' --data-binary @- https://ntfy.sh
