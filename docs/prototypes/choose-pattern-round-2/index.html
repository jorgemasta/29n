<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F7F3ED">
<meta name="robots" content="noindex">
<title>Prototipo · elegir a ciegas (ronda 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --crema:#F7F3ED; --blanco:#FFFFFF; --tinta:#04313E; --tinta-2:#4C595D; --tinta-3:#7B8E93;
  --petroleo:#0E5167; --petroleo-osc:#083D4E; --aqua:#D7E5EA; --aqua-2:#A0C7D2; --pista:#EBEEEF; --beige:#F7EFE4;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-hoja:cubic-bezier(0.32,0.72,0,1);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--crema)}
body{font-family:'Quicksand',system-ui,sans-serif;color:var(--tinta);font-size:18px;line-height:1.5;font-weight:500;background:var(--crema)}
button,a,[role="button"]{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid #FFDD00;outline-offset:2px;box-shadow:0 0 0 5px var(--tinta)}
h1:focus,h2:focus,[tabindex="-1"]:focus{outline:none;box-shadow:none}

.app{min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.app.pantalla{height:100dvh;min-height:0;overflow:hidden}
.top{position:sticky;top:0;z-index:5;background:var(--crema);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 16px 10px;border-bottom:2px solid var(--aqua);flex:none}
.logo{font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--petroleo) 0 50%, var(--aqua-2) 0)}
.top-r{display:flex;gap:8px}
.chip{height:44px;min-width:44px;padding:0 12px;border-radius:8px;border:1px solid var(--aqua);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:var(--blanco);transition:transform 120ms var(--ease-out)}
.chip:active{transform:scale(.97)}
.chip svg{width:20px;height:20px}
main{flex:1;padding:0 16px calc(170px + var(--safe-b))}
.prog{margin:12px 0 2px;display:flex;align-items:center;gap:10px}
.prog .barra{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.prog .barra b{height:6px;border-radius:99px;background:var(--pista)}
.prog .barra b.hecho{background:var(--petroleo)} .prog .barra b.ahora{background:var(--aqua-2)}
.prog small{font-size:15px;font-weight:700;color:var(--tinta-2)}
.cat{font-size:14px;font-weight:700;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.06em;margin-top:12px}
h1{font-size:25px;line-height:1.22;margin:6px 0 16px;font-weight:700}
h1.compacto{font-size:20px;margin:4px 0 12px}
.lead{font-size:17px;color:var(--tinta-2);margin:-6px 0 14px}

.carta{display:block;width:100%;background:var(--blanco);border-radius:8px;padding:14px 16px 16px;margin-bottom:12px;border:3px solid transparent;transition:transform 140ms var(--ease-out),border-color 140ms var(--ease-out),opacity 180ms var(--ease-out)}
.carta:active{transform:scale(.985)}
.carta .letra,.letra{display:inline-flex;width:34px;height:34px;border-radius:8px;background:var(--aqua);color:var(--petroleo-osc);font-weight:700;align-items:center;justify-content:center;font-size:17px;margin-bottom:8px}
.carta h3{font-size:18px;line-height:1.35;font-weight:700}
.carta p{font-size:16px;line-height:1.45;color:var(--tinta-2);margin-top:4px}
.cifra{display:inline-block;margin-top:8px;font-size:15px;font-weight:700;background:var(--pista);padding:2px 8px;border-radius:6px}
.carta[aria-pressed="true"]{border-color:var(--petroleo)}
.carta[aria-pressed="true"] .letra{background:var(--petroleo);color:#fff}
.carta.estatica{cursor:default}
.carta.estatica:active{transform:none}
.pista-tocar{font-size:15px;color:var(--tinta-2);text-align:center;margin:4px 0 0}

.accion{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:24px 16px calc(16px + var(--safe-b));background:linear-gradient(rgba(247,243,237,0),var(--crema) 28%)}
.accion-in{max-width:528px;margin:0 auto}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;min-height:58px;border-radius:8px;background:var(--petroleo);color:#fff;font-weight:700;font-size:18px;text-align:center;padding:0 16px;transition:transform 120ms var(--ease-out),background 120ms}
.btn:active{transform:scale(.97);background:var(--petroleo-osc)}
.btn.sec{background:var(--blanco);color:var(--petroleo);border:2px solid var(--petroleo)}
.btn.sec:active{background:var(--aqua)}
.link{display:block;width:100%;text-align:center;font-weight:700;color:var(--petroleo);text-decoration:underline;text-underline-offset:4px;font-size:16px;padding:12px 0 2px;min-height:44px}
@media (hover:hover) and (pointer:fine){
  .carta:not(.estatica):hover{border-color:var(--aqua-2)}
  .btn:hover{background:var(--petroleo-osc)} .btn.sec:hover{background:var(--aqua)}
  .opcion:hover{border-color:var(--petroleo)}
  .voto:hover{border-color:var(--petroleo)}
}

/* hoja (compartida) */
.opcional{display:inline-block;font-size:14px;font-weight:700;background:var(--beige);color:#7A5300;padding:2px 10px;border-radius:99px}
.opciones{display:flex;flex-direction:column;gap:10px}
.opcion{display:flex;width:100%;min-height:56px;background:var(--blanco);border:2px solid var(--aqua-2);border-radius:8px;align-items:center;padding:0 16px;font-weight:700;font-size:18px;justify-content:space-between;transition:transform 120ms var(--ease-out),border-color 120ms}
.opcion:active{transform:scale(.97);border-color:var(--petroleo)}
.opcion::after{content:'→';color:var(--petroleo)}
.velo{position:fixed;inset:0;z-index:20;background:rgba(4,49,62,.38);opacity:0;transition:opacity 500ms var(--ease-hoja)}
.velo.abierta{opacity:1}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--crema);border-radius:16px 16px 0 0;padding:10px 16px calc(16px + var(--safe-b));max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform 500ms var(--ease-hoja)}
.hoja.abierta{transform:translateY(0)}
.hoja .asa{width:40px;height:5px;border-radius:99px;background:var(--aqua-2);margin:0 auto 8px}
.hoja h2{font-size:22px;line-height:1.25;margin:6px 0 10px}

/* ===== Mazo ===== */
.mazo{position:relative;height:min(52dvh,440px);margin:4px 0 14px}
.naipe{position:absolute;inset:0;background:var(--blanco);border-radius:16px;padding:20px 20px 22px;display:flex;flex-direction:column;box-shadow:0 1px 0 var(--aqua),0 10px 30px rgba(4,49,62,.10);touch-action:pan-y;will-change:transform;cursor:grab;user-select:none;-webkit-user-select:none}
.naipe:active{cursor:grabbing}
.naipe.detras{transform:translateY(12px) scale(.95);box-shadow:0 1px 0 var(--aqua)}
.naipe h3{font-size:22px;line-height:1.3;font-weight:700}
.naipe p{font-size:17px;color:var(--tinta-2);margin-top:8px}
.naipe .cifra{align-self:flex-start;margin-top:12px}
.naipe .num{margin-top:auto;font-size:14px;font-weight:700;color:var(--tinta-3)}
.sello{position:absolute;top:18px;padding:4px 10px;border-radius:8px;border:3px solid;font-weight:700;font-size:16px;letter-spacing:.04em;opacity:0;pointer-events:none}
.sello.si{right:16px;color:var(--petroleo);border-color:var(--petroleo);transform:rotate(8deg);background:var(--blanco)}
.sello.no{right:16px;color:var(--tinta-2);border-color:var(--tinta-3);transform:rotate(8deg);background:var(--blanco)}
.votos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.voto{display:flex;align-items:center;justify-content:center;gap:8px;min-height:62px;border-radius:12px;border:2px solid var(--aqua-2);background:var(--blanco);font-weight:700;font-size:17px;transition:transform 120ms var(--ease-out),border-color 120ms}
.voto:active{transform:scale(.96)}
.voto svg{width:24px;height:24px}
.voto.si{background:var(--petroleo);color:#fff;border-color:var(--petroleo)}
.contador{text-align:center;font-size:15px;color:var(--tinta-2);font-weight:600;margin-top:10px}

/* ===== Feed ===== */
.feed-cab{padding:0 16px;flex:none}
.feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:4px 16px calc(14px + var(--safe-b));display:flex;flex-direction:column}
.slide-in{flex:1;background:var(--blanco);border-radius:16px;padding:22px 20px 18px;display:flex;flex-direction:column;position:relative}
.slide-in .letra{width:44px;height:44px;font-size:20px;border-radius:10px}
.slide-in h3{font-size:24px;line-height:1.28;font-weight:700}
.slide-in p{font-size:18px;color:var(--tinta-2);margin-top:10px}
.slide-in .cifra{align-self:flex-start;margin-top:14px}
.slide-pie{margin-top:auto;padding-top:16px}
.desliza{display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:700;color:var(--tinta-2);margin-top:10px}
.desliza svg{width:18px;height:18px}
.puntos{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.puntos i{width:6px;height:6px;border-radius:99px;background:var(--aqua-2);transition:height 200ms var(--ease-out),background 200ms}
.puntos i.on{height:18px;background:var(--petroleo)}
.slide-ninguna .slide-in{background:transparent;border:2px dashed var(--aqua-2);justify-content:center;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .desliza svg{animation:sube 1.6s var(--ease-out) infinite}
  @keyframes sube{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
}

/* ===== Duelo ===== */
.ronda{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;color:var(--tinta-2);margin-bottom:8px}
.ronda b{color:var(--tinta)}
.vs{display:flex;align-items:center;gap:10px;margin:-2px 0 10px;color:var(--tinta-3);font-weight:700;font-size:14px}
.vs::before,.vs::after{content:'';flex:1;height:1px;background:var(--aqua-2)}
.carta.duelo{min-height:150px;position:relative;padding-bottom:52px}
.carta.duelo .elige{position:absolute;left:16px;right:16px;bottom:12px;display:flex;align-items:center;justify-content:center;min-height:34px;border-radius:8px;background:var(--aqua);color:var(--petroleo-osc);font-weight:700;font-size:15px}
.carta.duelo.sale{opacity:0;transform:translateX(-24px)}
.carta.duelo.gana{border-color:var(--petroleo)}
.carta.duelo.entra{animation:entra 220ms var(--ease-out)}
@keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* final */
.lista{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--pista);font-size:17px}
.lista:last-child{border:0}
.lista span{color:var(--tinta-2);font-weight:600}
.caja{background:var(--blanco);border-radius:8px;padding:6px 16px;margin-bottom:12px}
.nota-proto{font-size:14px;color:var(--tinta-3);text-align:center;margin-top:8px}

@media (prefers-reduced-motion:reduce){
  .hoja{transition:opacity 160ms;transform:none;opacity:0} .hoja.abierta{opacity:1}
  .velo{transition:opacity 160ms}
  .carta,.btn,.opcion,.chip,.voto{transition:none}
  .carta.duelo.sale{transform:none;transition:opacity 150ms}
  .carta.duelo.entra{animation:none}
}

/* ===== picker (verbatim) ===== */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,0.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24),0 2px 6px rgba(0,0,0,0.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,0.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(0.23,1,0.32,1),width 250ms cubic-bezier(0.23,1,0.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,0.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,0.85)}
.proto-picker-item:active{transform:scale(0.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px;box-shadow:none}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,0.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
.proto-picker[data-position="top"]{bottom:auto;top:24px}
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Hoja</button>
  <button class="proto-picker-item">Mazo</button>
  <button class="proto-picker-item">Feed</button>
  <button class="proto-picker-item">Duelo</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const PARTIDOS = ['Partido de prueba A','Partido de prueba B','Partido de prueba C','Partido de prueba D'];
const TEMAS = [
  { nombre:'Vivienda y alquiler', corto:'Vivienda', pregunta:'¿Qué harían con el precio de la vivienda y el alquiler?', props:[
    {que:'Crear una empresa pública estatal que construya vivienda de alquiler asequible.', como:'Los alquileres no superarían el 30 % de los ingresos del hogar que viva en ellas.', cifra:'50.000 viviendas al año'},
    {que:'Limitar el precio del alquiler en las zonas con más demanda.', como:'Y subir el IBI, el impuesto municipal sobre la casa, a las viviendas vacías más de dos años.', cifra:null},
    {que:'Quitar el impuesto que se paga al comprar la primera vivienda.', como:'Además, liberar suelo público para que se construyan más viviendas.', cifra:null},
    {que:'Que el Estado avale a los jóvenes para comprar su primera vivienda.', como:'Podrían pedir una hipoteca por el precio completo, sin pagar entrada.', cifra:'Menores de 35 años'},
  ]},
  { nombre:'Empleo y salarios', corto:'Empleo', pregunta:'¿Qué harían con el empleo, los salarios y la jornada de trabajo?', props:[
    {que:'Pagar a los trabajadores mientras se forman para cambiar de oficio.', como:'Podrían reciclarse seis meses cobrando una parte de su sueldo.', cifra:'Seis meses al 70 % del sueldo'},
    {que:'Bajar la jornada laboral máxima sin bajar el sueldo.', como:'Por ley para todos los sectores, y subir el salario mínimo al 60 % del salario medio.', cifra:'35 horas semanales'},
    {que:'Hacer que los autónomos paguen su cuota según lo que ganen de verdad.', como:'Y tendrían derecho a cobrar el paro si cierran su negocio.', cifra:null},
    {que:'Bajar lo que pagan las empresas a la Seguridad Social por contratar a jóvenes.', como:'Solo para contratos indefinidos, durante los tres primeros años.', cifra:'Menores de 30 años'},
  ]},
];
const LETRAS = ['A','B','C','D'];
const RESTO = ['Sanidad','Pensiones','Inmigración'];
const reducido = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON_MENU = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
const ICON_SI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const ICON_NO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ICON_ARRIBA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';

function barraSup(n){ return `<header class="top"><div class="logo"><i aria-hidden="true"></i>29N</div><div class="top-r"><button class="chip">Temas · ${n}/5</button><button class="chip" aria-label="Letra grande">Aa</button><button class="chip" aria-label="Menú">${ICON_MENU}</button></div></header>`; }
function prog(i){ return `<div class="prog" aria-hidden="true"><div class="barra">${[0,1,2,3,4].map(k=>`<b class="${k<i?'hecho':k===i?'ahora':''}"></b>`).join('')}</div><small>${i+1}/5</small></div>`; }
function cuerpoProp(p){ return `<h3>${esc(p.que)}</h3><p>${esc(p.como)}</p>${p.cifra?`<span class="cifra">${esc(p.cifra)}</span>`:''}`; }
function cartaHtml(p,k,sel,estatica){ return `<button class="carta${estatica?' estatica':''}" data-k="${k}" aria-pressed="${sel===k}"><span class="letra">${LETRAS[k]}</span>${cuerpoProp(p)}</button>`; }
function accion(inner){ return `<div class="accion"><div class="accion-in">${inner}</div></div>`; }
function textoEleccion(e){ return e.k===null ? 'Ninguna' : `Elegiste la ${LETRAS[e.k]}`; }

function pantallaFinal(estado){
  const adiv = estado.elecciones.filter(e=>e.apuesta!==null).length;
  return `${barraSup(5)}<main>${prog(4).replace('ahora','hecho')}
    <h1 tabindex="-1" style="font-size:28px;margin-top:18px">Has terminado los temas</h1>
    <p class="lead" style="margin:0 0 16px">Has elegido sin saber de quién era cada propuesta. Ahora puedes verlo.</p>
    <div class="caja">${estado.elecciones.map((e,i)=>`<div class="lista"><span>${TEMAS[i].corto}</span><b>${textoEleccion(e)}</b></div>`).join('')}
    ${RESTO.map(r=>`<div class="lista"><span>${r}</span><b style="color:var(--tinta-3)">(en la app real)</b></div>`).join('')}</div>
    <p class="lead" style="margin-top:4px">${adiv ? `Adivinaste en ${adiv} ${adiv===1?'tema':'temas'}.` : 'No has adivinado en ningún tema.'}</p>
    <p class="nota-proto">Prototipo: solo 2 temas jugables.</p>
  </main>${accion(`<button class="btn">Destapar mis resultados</button><button class="link" data-accion="reiniciar">Empezar de nuevo</button>`)}`;
}

/* ---------- Motor común: temas, hoja de adivinar, final ---------- */
function juego(renderTema){
  return () => {
    const s = { tema:0, elecciones:[] };
    return { html:()=>'<div class="app" id="app"></div><div id="capa"></div>', init(stage){
      const app = stage.querySelector('#app'), capa = stage.querySelector('#capa');
      let alCambiar = null;
      const cerrarHoja = (luego) => {
        const h=capa.querySelector('.hoja'), v=capa.querySelector('.velo'); if(!h){ luego?.(); return; }
        h.classList.remove('abierta'); v.classList.remove('abierta');
        setTimeout(()=>{ capa.innerHTML=''; luego?.(); }, reducido()?160:340);
      };
      const avanzar = (k, apuesta) => { s.elecciones.push({k, apuesta}); s.tema++; render(); };
      const ctx = {
        app,
        elegir(k){
          const p=TEMAS[s.tema].props[k];
          capa.innerHTML = `<div class="velo" data-h="cambiar"></div><section class="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-t"><div class="asa" aria-hidden="true"></div>
            <h2 id="hoja-t" tabindex="-1">Te quedas con la ${LETRAS[k]}</h2>
            <div class="carta estatica" style="border-color:var(--petroleo)"><span class="letra" style="background:var(--petroleo);color:#fff">${LETRAS[k]}</span><h3>${esc(p.que)}</h3></div>
            <span class="opcional">Opcional</span>
            <p style="font-weight:700;margin:6px 0 10px">¿De qué partido crees que es? Lo verás al final.</p>
            <div class="opciones">${PARTIDOS.map((n,j)=>`<button class="opcion" data-apuesta="${j}">${n}</button>`).join('')}</div>
            <div style="margin-top:14px"><button class="btn sec" data-h="saltar">No lo sé, siguiente tema</button>
            <button class="link" data-h="cambiar">Cambiar mi elección</button></div></section>`;
          const hoja=capa.querySelector('.hoja');
          hoja.addEventListener('click', e => {
            const ap=e.target.closest('[data-apuesta]'), h=e.target.closest('[data-h]');
            if (ap) cerrarHoja(()=>avanzar(k, +ap.dataset.apuesta));
            else if (h?.dataset.h==='saltar') cerrarHoja(()=>avanzar(k, null));
            else if (h?.dataset.h==='cambiar') cerrarHoja(()=>alCambiar?.());
          });
          capa.querySelector('.velo').addEventListener('click', ()=>cerrarHoja(()=>alCambiar?.()));
          requestAnimationFrame(()=>requestAnimationFrame(()=>{ hoja.classList.add('abierta'); capa.querySelector('.velo').classList.add('abierta'); capa.querySelector('#hoja-t').focus({preventScroll:true}); }));
        },
        ninguna(){ avanzar(null, null); },
        alCambiar(fn){ alCambiar = fn; },
      };
      const render = () => {
        app.className = 'app'; alCambiar = null;
        if (s.tema >= TEMAS.length) {
          app.innerHTML = pantallaFinal(s);
          app.querySelector('[data-accion="reiniciar"]').addEventListener('click', ()=>{ s.tema=0; s.elecciones=[]; render(); });
        } else renderTema(ctx, TEMAS[s.tema], s.tema);
        const h=app.querySelector('h1'); h?.focus({preventScroll:true}); window.scrollTo(0,0);
      };
      stage.addEventListener('keydown', e => { if (e.key==='Escape' && capa.innerHTML) cerrarHoja(()=>alCambiar?.()); });
      render();
    }};
  };
}

/* ============ 1 · Hoja (referencia) ============ */
const varHoja = juego((ctx, t, i) => {
  const pintar = () => {
    ctx.app.innerHTML = `${barraSup(i+1)}<main>${prog(i)}<div class="cat">Tema ${i+1} de 5 · ${t.nombre}</div><h1 tabindex="-1">${t.pregunta}</h1>
      ${t.props.map((p,k)=>cartaHtml(p,k,null)).join('')}
      <p class="pista-tocar">Toca la propuesta que más te convenza.</p></main>
      ${accion(`<button class="btn sec" data-accion="ninguna">Ninguna me convence</button>`)}`;
    ctx.app.querySelectorAll('[data-k]').forEach(c => c.addEventListener('click', () => { c.setAttribute('aria-pressed','true'); ctx.elegir(+c.dataset.k); }));
    ctx.app.querySelector('[data-accion="ninguna"]').addEventListener('click', () => ctx.ninguna());
  };
  ctx.alCambiar(() => ctx.app.querySelectorAll('[data-k]').forEach(c=>c.setAttribute('aria-pressed','false')));
  pintar();
});

/* ============ 2 · Mazo (Tinder) ============ */
function muelle(desde, hasta, v0, alPintar, alAcabar, opciones={}){
  // Muelle amortiguado sembrado con la velocidad de salida del dedo (px/ms).
  const k = opciones.k ?? 380, c = opciones.c ?? 30;
  let x = desde, v = v0*1000, ultimo = performance.now(), id = 0;
  const paso = (ahora) => {
    const dt = Math.min(32, ahora-ultimo)/1000; ultimo = ahora;
    v += (-k*(x-hasta) - c*v)*dt; x += v*dt; alPintar(x);
    if (opciones.parar?.(x)) { alAcabar?.(); return; }
    if (Math.abs(v) < 6 && Math.abs(x-hasta) < 0.6) { alPintar(hasta); alAcabar?.(); return; }
    id = requestAnimationFrame(paso);
  };
  id = requestAnimationFrame(paso);
  return () => cancelAnimationFrame(id);
}
const varMazo = juego((ctx, t, i) => {
  const n = t.props.length;
  const st = { idx:0, votos:[] };
  const pintar = () => {
    if (st.idx >= n) return resumen();
    const p = t.props[st.idx], sig = t.props[st.idx+1];
    ctx.app.innerHTML = `${barraSup(i+1)}<main>${prog(i)}<div class="cat">Tema ${i+1} de 5 · ${t.nombre}</div><h1 tabindex="-1" class="compacto">${t.pregunta}</h1>
      <div class="mazo">
        ${sig?`<div class="naipe detras" aria-hidden="true"><span class="letra">${LETRAS[st.idx+1]}</span>${cuerpoProp(sig)}</div>`:''}
        <article class="naipe arriba" aria-label="Propuesta ${LETRAS[st.idx]}"><span class="sello si">ME CONVENCE</span><span class="sello no">NO</span><span class="letra">${LETRAS[st.idx]}</span>${cuerpoProp(p)}<span class="num">Propuesta ${st.idx+1} de ${n}</span></article>
      </div>
      <div class="votos"><button class="voto" data-voto="no">${ICON_NO}No me convence</button><button class="voto si" data-voto="si">${ICON_SI}Me convence</button></div>
      <p class="contador">Desliza la tarjeta o usa los botones.${st.idx?' <button class="link" data-accion="atras" style="display:inline;width:auto;padding:0 0 0 4px;min-height:0">Volver a la anterior</button>':''}</p>
      </main>`;
    const naipe = ctx.app.querySelector('.naipe.arriba'), detras = ctx.app.querySelector('.naipe.detras');
    const si = naipe.querySelector('.sello.si'), no = naipe.querySelector('.sello.no');
    let x = 0, y = 0, parar = null, arrastrando = false, ox = 0, oy = 0, hist = [];
    const W = () => naipe.offsetWidth;
    // Valores enlazados: rotación, sellos y el naipe de detrás salen todos de x.
    const aplicar = (nx, ny=y) => {
      x = nx; y = ny;
      const rot = reducido() ? 0 : x*0.05;
      naipe.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
      si.style.opacity = Math.max(0, Math.min(1, x/90)); no.style.opacity = Math.max(0, Math.min(1, -x/90));
      if (detras) { const p = Math.min(1, Math.abs(x)/150); detras.style.transform = `translateY(${12-12*p}px) scale(${0.95+0.05*p})`; }
    };
    const decidir = (voto) => { st.votos[st.idx] = voto; st.idx++; pintar(); };
    const salir = (dir, v0) => {
      parar?.();
      if (reducido()) { naipe.style.transition='opacity 150ms'; naipe.style.opacity='0'; setTimeout(()=>decidir(dir>0), 150); return; }
      parar = muelle(x, dir*W()*1.6, v0, nx => aplicar(nx, y), () => decidir(dir>0), { parar: nx => Math.abs(nx) > W()*1.25 });
    };
    naipe.addEventListener('pointerdown', e => {
      parar?.(); arrastrando = true; naipe.setPointerCapture(e.pointerId);
      ox = e.clientX - x; oy = e.clientY - y; hist = [{x, t:e.timeStamp}];
    });
    naipe.addEventListener('pointermove', e => {
      if (!arrastrando) return;
      aplicar(e.clientX - ox, (e.clientY - oy)*0.25);   // 1:1 en x, resistencia en y
      hist.push({x, t:e.timeStamp}); if (hist.length > 5) hist.shift();
    });
    const soltar = (cancelado) => {
      if (!arrastrando) return; arrastrando = false;
      const a = hist[0], b = hist[hist.length-1]; const v = b && a && b.t>a.t ? (b.x-a.x)/(b.t-a.t) : 0;
      if (!cancelado && (Math.abs(x) > W()*0.35 || Math.abs(v) > 0.5)) return salir(Math.sign(x || v), v);
      parar = muelle(x, 0, v, nx => aplicar(nx, y*0.8), () => aplicar(0, 0), { k:520, c:36 });   // vuelta rápida
    };
    naipe.addEventListener('pointerup', () => soltar(false));
    naipe.addEventListener('pointercancel', () => soltar(true));
    ctx.app.querySelectorAll('[data-voto]').forEach(b => b.addEventListener('click', () => {
      // Por botón no hay fuerza: sale con una transición ease-out, sin rebote.
      const dir = b.dataset.voto==='si' ? 1 : -1;
      if (reducido()) return salir(dir, 0);
      naipe.style.transition = 'transform 260ms var(--ease-out)';
      si.style.transition = no.style.transition = 'opacity 120ms';
      if (detras) { detras.style.transition = 'transform 260ms var(--ease-out)'; detras.style.transform = 'none'; }
      naipe.style.transform = `translateX(${dir*W()*1.3}px) rotate(${dir*14}deg)`;
      (dir>0?si:no).style.opacity = 1;
      setTimeout(()=>decidir(dir>0), 260);
    }));
    ctx.app.querySelector('[data-accion="atras"]')?.addEventListener('click', () => { st.idx--; pintar(); });
  };
  const resumen = () => {
    const gustan = st.votos.map((v,k)=>v?k:null).filter(k=>k!==null);
    if (gustan.length === 1) { pintarFondo(`Te ha convencido solo la ${LETRAS[gustan[0]]}.`); return ctx.elegir(gustan[0]); }
    if (gustan.length === 0) {
      ctx.app.innerHTML = `${barraSup(i+1)}<main>${prog(i)}<div class="cat">Tema ${i+1} de 5 · ${t.nombre}</div>
        <h1 tabindex="-1">No te ha convencido ninguna</h1><p class="lead" style="margin-top:0">Pasa, y es una respuesta válida. Contará como «Ninguna».</p></main>
        ${accion(`<button class="btn" data-accion="ninguna">Siguiente tema</button><button class="link" data-accion="otra">Volver a verlas</button>`)}`;
      ctx.app.querySelector('[data-accion="ninguna"]').addEventListener('click', ()=>ctx.ninguna());
      ctx.app.querySelector('[data-accion="otra"]').addEventListener('click', ()=>{ st.idx=0; st.votos=[]; pintar(); });
      ctx.app.querySelector('h1').focus({preventScroll:true});
      return;
    }
    ctx.app.innerHTML = `${barraSup(i+1)}<main>${prog(i)}<div class="cat">Tema ${i+1} de 5 · ${t.nombre}</div>
      <h1 tabindex="-1">Te convencen ${gustan.length}. ¿Con cuál te quedas?</h1>
      ${gustan.map(k=>cartaHtml(t.props[k],k,null)).join('')}</main>
      ${accion(`<button class="link" data-accion="otra">Volver a verlas todas</button>`)}`;
    ctx.app.querySelectorAll('[data-k]').forEach(c => c.addEventListener('click', () => { c.setAttribute('aria-pressed','true'); ctx.elegir(+c.dataset.k); }));
    ctx.app.querySelector('[data-accion="otra"]').addEventListener('click', ()=>{ st.idx=0; st.votos=[]; pintar(); });
    ctx.app.querySelector('h1').focus({preventScroll:true});
  };
  const pintarFondo = (texto) => {
    ctx.app.innerHTML = `${barraSup(i+1)}<main>${prog(i)}<div class="cat">Tema ${i+1} de 5 · ${t.nombre}</div><h1 tabindex="-1">${texto}</h1></main>`;
  };
  ctx.alCambiar(() => { st.idx = 0; st.votos = []; pintar(); });
  pintar();
});

/* ============ 3 · Feed (TikTok) ============ */
const varFeed = juego((ctx, t, i) => {
  const n = t.props.length;
  ctx.app.className = 'app pantalla';
  ctx.app.innerHTML = `${barraSup(i+1)}<div class="feed-cab">${prog(i)}<div class="cat">Tema ${i+1} de 5 · ${t.nombre}</div><h1 tabindex="-1" class="compacto">${t.pregunta}</h1></div>
    <div class="feed" id="feed">
      ${t.props.map((p,k)=>`<section class="slide" aria-label="Propuesta ${LETRAS[k]} de ${n}"><div class="slide-in">
        <span class="letra">${LETRAS[k]}</span>${cuerpoProp(p)}
        <div class="slide-pie"><button class="btn" data-k="${k}">Me quedo con la ${LETRAS[k]}</button>
        <div class="desliza">${ICON_ARRIBA}${k<n-1?`Desliza hacia arriba: quedan ${n-1-k}`:'Desliza para ver el final'}</div></div>
      </div></section>`).join('')}
      <section class="slide slide-ninguna" aria-label="Ninguna"><div class="slide-in">
        <h3 style="font-size:24px">¿Ninguna te convence?</h3>
        <p>También es una respuesta. Contará como «Ninguna».</p>
        <div style="margin-top:20px"><button class="btn sec" data-accion="ninguna">Ninguna me convence</button>
        <button class="link" data-accion="arriba">Volver a la primera</button></div>
      </div></section>
    </div>`;
  const feed = ctx.app.querySelector('#feed');
  // Indicador de posición a la derecha, fuera del flujo de cada diapositiva.
  const puntos = document.createElement('div'); puntos.className='puntos'; puntos.setAttribute('aria-hidden','true');
  puntos.innerHTML = Array.from({length:n+1},(_,k)=>`<i class="${k?'':'on'}"></i>`).join('');
  feed.style.position='relative'; ctx.app.appendChild(puntos);
  puntos.style.position='fixed'; puntos.style.top='62%';
  let raf=0;
  feed.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ const k=Math.round(feed.scrollTop/feed.clientHeight); puntos.querySelectorAll('i').forEach((el,j)=>el.classList.toggle('on', j===k)); }); }, {passive:true});
  feed.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => ctx.elegir(+b.dataset.k)));
  feed.querySelector('[data-accion="ninguna"]').addEventListener('click', () => ctx.ninguna());
  feed.querySelector('[data-accion="arriba"]').addEventListener('click', () => feed.scrollTo({top:0, behavior:reducido()?'auto':'smooth'}));
});

/* ============ 4 · Duelo ============ */
const varDuelo = juego((ctx, t, i) => {
  const n = t.props.length;
  const st = { campeon:0, retador:1 };
  const pintar = (entra) => {
    const ronda = st.retador, total = n-1;
    ctx.app.innerHTML = `${barraSup(i+1)}<main>${prog(i)}<div class="cat">Tema ${i+1} de 5 · ${t.nombre}</div><h1 tabindex="-1" class="compacto">${t.pregunta}</h1>
      <div class="ronda"><b>¿Cuál te convence más?</b><span>Ronda ${ronda} de ${total}</span></div>
      ${[st.campeon, st.retador].map((k,j)=>`${j?'<div class="vs">frente a</div>':''}<button class="carta duelo${entra===j?' entra':''}" data-k="${k}"><span class="letra">${LETRAS[k]}</span>${cuerpoProp(t.props[k])}<span class="elige">Me convence más esta</span></button>`).join('')}
      <p class="pista-tocar">La que elijas pasa a la siguiente ronda.</p></main>
      ${accion(`<button class="btn sec" data-accion="ninguna">Ninguna me convence</button>`)}`;
    ctx.app.querySelectorAll('[data-k]').forEach(c => c.addEventListener('click', () => {
      const k = +c.dataset.k, otra = [...ctx.app.querySelectorAll('[data-k]')].find(x=>x!==c);
      c.classList.add('gana'); otra.classList.add('sale');
      setTimeout(() => {
        if (st.retador >= n-1) return ctx.elegir(k);
        st.campeon = k; st.retador++; pintar(1);
      }, reducido()?150:200);
    }));
    ctx.app.querySelector('[data-accion="ninguna"]').addEventListener('click', () => ctx.ninguna());
  };
  ctx.alCambiar(() => { st.campeon=0; st.retador=1; pintar(); });
  pintar();
});

/* ============ Harness (picker) ============ */
const variants = [varHoja, varMazo, varFeed, varDuelo];
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) {
  // Nodo nuevo en cada montaje: los listeners de la variante anterior se van con el viejo.
  const old = document.getElementById('stage'); const fresh = old.cloneNode(false); old.replaceWith(fresh);
  requestAnimationFrame(() => { const v = variants[i](); fresh.innerHTML = v.html(); v.init(fresh); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
