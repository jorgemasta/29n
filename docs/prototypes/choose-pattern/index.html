<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F7F3ED">
<meta name="robots" content="noindex">
<title>Prototipo · tema a ciegas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --crema:#F7F3ED; --blanco:#FFFFFF; --tinta:#04313E; --tinta-2:#4C595D; --tinta-3:#7B8E93;
  --petroleo:#0E5167; --petroleo-osc:#083D4E; --aqua:#D7E5EA; --aqua-2:#A0C7D2; --pista:#EBEEEF; --beige:#F7EFE4;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
/* mobile-native baseline */
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--crema)}
body{font-family:'Quicksand',system-ui,sans-serif;color:var(--tinta);font-size:18px;line-height:1.5;font-weight:500;background:var(--crema)}
button,a,[role="button"]{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid #FFDD00;outline-offset:2px;box-shadow:0 0 0 5px var(--tinta)}

.app{min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{position:sticky;top:0;z-index:5;background:var(--crema);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 16px 10px;border-bottom:2px solid var(--aqua)}
.logo{font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--petroleo) 0 50%, var(--aqua-2) 0)}
.top-r{display:flex;gap:8px}
.chip{height:44px;min-width:44px;padding:0 12px;border-radius:8px;border:1px solid var(--aqua);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:var(--blanco);transition:transform 120ms var(--ease-out)}
.chip:active{transform:scale(.97)}
.chip svg{width:20px;height:20px}
main{flex:1;padding:0 16px calc(170px + var(--safe-b))}
.prog{margin:14px 0 4px;display:flex;align-items:center;gap:10px}
.prog .barra{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.prog .barra b{height:6px;border-radius:99px;background:var(--pista)}
.prog .barra b.hecho{background:var(--petroleo)} .prog .barra b.ahora{background:var(--aqua-2)}
.prog small{font-size:15px;font-weight:700;color:var(--tinta-2)}
.cat{font-size:14px;font-weight:700;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.06em;margin-top:14px}
h1{font-size:25px;line-height:1.22;margin:6px 0 16px;font-weight:700}
h1:focus,[tabindex="-1"]:focus{outline:none;box-shadow:none}
.lead{font-size:17px;color:var(--tinta-2);margin:-6px 0 14px}

/* tarjeta */
.carta{display:block;width:100%;background:var(--blanco);border-radius:8px;padding:14px 16px 16px;margin-bottom:12px;border:3px solid transparent;transition:transform 140ms var(--ease-out),border-color 140ms var(--ease-out)}
.carta:active{transform:scale(.985)}
.carta .letra{display:inline-flex;width:34px;height:34px;border-radius:8px;background:var(--aqua);color:var(--petroleo-osc);font-weight:700;align-items:center;justify-content:center;font-size:17px;margin-bottom:8px;transition:background 140ms,color 140ms}
.carta h3{font-size:18px;line-height:1.35;font-weight:700}
.carta p{font-size:16px;line-height:1.45;color:var(--tinta-2);margin-top:4px}
.carta .cifra{display:inline-block;margin-top:8px;font-size:15px;font-weight:700;background:var(--pista);padding:2px 8px;border-radius:6px}
.carta[aria-pressed="true"]{border-color:var(--petroleo)}
.carta[aria-pressed="true"] .letra{background:var(--petroleo);color:#fff}
.carta.estatica{cursor:default}
.carta.estatica:active{transform:none}
.pista-tocar{font-size:15px;color:var(--tinta-2);text-align:center;margin:4px 0 0}

/* accion fija */
.accion{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:24px 16px calc(16px + var(--safe-b));background:linear-gradient(rgba(247,243,237,0),var(--crema) 28%)}
.accion-in{max-width:528px;margin:0 auto}
.btn{display:flex;width:100%;align-items:center;justify-content:center;min-height:58px;border-radius:8px;background:var(--petroleo);color:#fff;font-weight:700;font-size:18px;text-align:center;padding:0 16px;transition:transform 120ms var(--ease-out),background 120ms,opacity 160ms}
.btn:active{transform:scale(.97);background:var(--petroleo-osc)}
.btn[disabled]{background:var(--pista);color:var(--tinta-3);cursor:not-allowed}
.btn[disabled]:active{transform:none}
.btn.sec{background:var(--blanco);color:var(--petroleo);border:2px solid var(--petroleo)}
.btn.sec:active{background:var(--aqua)}
.link{display:block;width:100%;text-align:center;font-weight:700;color:var(--petroleo);text-decoration:underline;text-underline-offset:4px;font-size:16px;padding:12px 0 2px;min-height:44px}
@media (hover:hover) and (pointer:fine){
  .carta:hover{border-color:var(--aqua-2)}
  .carta[aria-pressed="true"]:hover{border-color:var(--petroleo)}
  .btn:not([disabled]):hover{background:var(--petroleo-osc)}
  .btn.sec:hover{background:var(--aqua)}
  .opcion:hover{border-color:var(--petroleo)}
}

/* adivinar */
.opcional{display:inline-block;font-size:14px;font-weight:700;background:var(--beige);color:#7A5300;padding:2px 10px;border-radius:99px;margin-top:16px}
.opciones{display:flex;flex-direction:column;gap:10px}
.opcion{display:flex;width:100%;min-height:58px;background:var(--blanco);border:2px solid var(--aqua-2);border-radius:8px;align-items:center;padding:0 16px;font-weight:700;font-size:18px;justify-content:space-between;transition:transform 120ms var(--ease-out),border-color 120ms}
.opcion:active{transform:scale(.97);border-color:var(--petroleo)}
.opcion::after{content:'→';color:var(--petroleo)}
.aviso-ok{background:var(--blanco);border-radius:8px;padding:12px 14px;font-size:16px;font-weight:600;margin-bottom:12px}

/* hoja */
.velo{position:fixed;inset:0;z-index:20;background:rgba(4,49,62,.38);opacity:0;transition:opacity 200ms var(--ease-out)}
.velo.abierta{opacity:1}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--crema);border-radius:16px 16px 0 0;padding:10px 16px calc(16px + var(--safe-b));max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform 260ms var(--ease-out)}
.hoja.abierta{transform:translateY(0)}
.hoja .asa{width:40px;height:5px;border-radius:99px;background:var(--aqua-2);margin:0 auto 8px}
.hoja h2{font-size:22px;line-height:1.25;margin:8px 0 10px}
@media (prefers-reduced-motion:reduce){
  .hoja{transition:opacity 160ms;transform:none;opacity:0}
  .hoja.abierta{opacity:1}
  .carta,.btn,.opcion,.chip{transition:none}
}

/* una a una */
.segmento{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:4px;background:var(--aqua);border-radius:10px;padding:4px;margin-bottom:12px}
.segmento button{min-height:44px;border-radius:7px;text-align:center;font-weight:700;font-size:17px;color:var(--petroleo-osc);transition:background 160ms var(--ease-out)}
.segmento button[aria-selected="true"]{background:var(--blanco);color:var(--tinta)}
.pista-carrusel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none;overscroll-behavior-x:contain}
.pista-carrusel::-webkit-scrollbar{display:none}
.diapo{flex:0 0 100%;scroll-snap-align:center;background:var(--blanco);border-radius:8px;padding:18px 16px;min-height:300px;display:flex;flex-direction:column}
.diapo .letra{display:inline-flex;width:40px;height:40px;border-radius:8px;background:var(--aqua);color:var(--petroleo-osc);font-weight:700;align-items:center;justify-content:center;font-size:19px;margin-bottom:10px}
.diapo h3{font-size:21px;line-height:1.3}
.diapo p{font-size:17px;color:var(--tinta-2);margin-top:8px}
.diapo .cifra{align-self:flex-start;margin-top:12px;font-size:15px;font-weight:700;background:var(--pista);padding:2px 8px;border-radius:6px}
.diapo.elegida{outline:3px solid var(--petroleo);outline-offset:-3px}
.leidas{font-size:15px;color:var(--tinta-2);text-align:center;margin-top:10px}

/* final */
.lista{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--pista);font-size:17px}
.lista:last-child{border:0}
.lista span{color:var(--tinta-2);font-weight:600}
.caja{background:var(--blanco);border-radius:8px;padding:6px 16px;margin-bottom:12px}
.nota-proto{font-size:14px;color:var(--tinta-3);text-align:center;margin-top:8px}

/* ===== picker (verbatim) ===== */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,0.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24),0 2px 6px rgba(0,0,0,0.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,0.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(0.23,1,0.32,1),width 250ms cubic-bezier(0.23,1,0.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,0.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,0.85)}
.proto-picker-item:active{transform:scale(0.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px;box-shadow:none}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,0.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
.proto-picker[data-position="top"]{bottom:auto;top:24px}
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Pasos</button>
  <button class="proto-picker-item">Hoja</button>
  <button class="proto-picker-item">Carrusel</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const PARTIDOS = ['Partido de prueba A','Partido de prueba B','Partido de prueba C','Partido de prueba D'];
const TEMAS = [
  { nombre:'Vivienda y alquiler', corto:'Vivienda', pregunta:'¿Qué harían con el precio de la vivienda y el alquiler?', props:[
    {que:'Crear una empresa pública estatal que construya vivienda de alquiler asequible.', como:'Los alquileres no superarían el 30 % de los ingresos del hogar que viva en ellas.', cifra:'50.000 viviendas al año'},
    {que:'Limitar el precio del alquiler en las zonas con más demanda.', como:'Y subir el IBI, el impuesto municipal sobre la casa, a las viviendas vacías más de dos años.', cifra:null},
    {que:'Quitar el impuesto que se paga al comprar la primera vivienda.', como:'Además, liberar suelo público para que se construyan más viviendas.', cifra:null},
    {que:'Que el Estado avale a los jóvenes para comprar su primera vivienda.', como:'Podrían pedir una hipoteca por el precio completo, sin pagar entrada.', cifra:'Menores de 35 años'},
  ]},
  { nombre:'Empleo y salarios', corto:'Empleo', pregunta:'¿Qué harían con el empleo, los salarios y la jornada de trabajo?', props:[
    {que:'Pagar a los trabajadores mientras se forman para cambiar de oficio.', como:'Podrían reciclarse seis meses cobrando una parte de su sueldo.', cifra:'Seis meses al 70 % del sueldo'},
    {que:'Bajar la jornada laboral máxima sin bajar el sueldo.', como:'Por ley para todos los sectores, y subir el salario mínimo al 60 % del salario medio.', cifra:'35 horas semanales'},
    {que:'Hacer que los autónomos paguen su cuota según lo que ganen de verdad.', como:'Y tendrían derecho a cobrar el paro si cierran su negocio.', cifra:null},
    {que:'Bajar lo que pagan las empresas a la Seguridad Social por contratar a jóvenes.', como:'Solo para contratos indefinidos, durante los tres primeros años.', cifra:'Menores de 30 años'},
  ]},
];
const LETRAS = ['A','B','C','D'];
const RESTO = ['Sanidad','Pensiones','Inmigración'];

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON_MENU = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';

function barraSup(n){ return `<header class="top"><div class="logo"><i aria-hidden="true"></i>29N</div><div class="top-r"><button class="chip">Temas · ${n}/5</button><button class="chip" aria-label="Letra grande">Aa</button><button class="chip" aria-label="Menú">${ICON_MENU}</button></div></header>`; }
function prog(i){ return `<div class="prog" aria-hidden="true"><div class="barra">${[0,1,2,3,4].map(k=>`<b class="${k<i?'hecho':k===i?'ahora':''}"></b>`).join('')}</div><small>${i+1}/5</small></div>`; }
function cabeceraTema(i){ const t=TEMAS[i]; return `${prog(i)}<div class="cat">Tema ${i+1} de 5 · ${t.nombre}</div><h1 tabindex="-1">${t.pregunta}</h1>`; }
function cuerpoProp(p){ return `<h3>${esc(p.que)}</h3><p>${esc(p.como)}</p>${p.cifra?`<span class="cifra">${esc(p.cifra)}</span>`:''}`; }
function cartaHtml(p,k,sel,estatica){ return `<button class="carta${estatica?' estatica':''}" data-k="${k}" aria-pressed="${sel===k}"><span class="letra">${LETRAS[k]}</span>${cuerpoProp(p)}</button>`; }
function accion(inner){ return `<div class="accion"><div class="accion-in">${inner}</div></div>`; }
function textoEleccion(e){ return e.k===null ? 'Ninguna' : `Elegiste la ${LETRAS[e.k]}`; }

function pantallaFinal(estado){
  const adiv = estado.elecciones.filter(e=>e.apuesta!==null).length;
  return `${barraSup(5)}<main>${prog(4).replace('ahora','hecho')}
    <h1 tabindex="-1" style="font-size:28px;margin-top:18px">Has terminado los temas</h1>
    <p class="lead" style="margin:0 0 16px">Has elegido sin saber de quién era cada propuesta. Ahora puedes verlo.</p>
    <div class="caja">${estado.elecciones.map((e,i)=>`<div class="lista"><span>${TEMAS[i].corto}</span><b>${textoEleccion(e)}</b></div>`).join('')}
    ${RESTO.map(r=>`<div class="lista"><span>${r}</span><b style="color:var(--tinta-3)">(en la app real)</b></div>`).join('')}</div>
    <p class="lead" style="margin-top:4px">${adiv ? `Adivinaste en ${adiv} ${adiv===1?'tema':'temas'}.` : 'No has adivinado en ningún tema.'}</p>
    <p class="nota-proto">Prototipo: solo 2 temas jugables. Toca ↻ arriba para empezar de nuevo.</p>
  </main>${accion(`<button class="btn">Destapar mis resultados</button><button class="link" data-accion="reiniciar">Cambiar alguna elección antes</button>`)}`;
}

function enfocarTitular(stage){ const h=stage.querySelector('h1'); if(h) h.focus({preventScroll:true}); window.scrollTo(0,0); }

/* ============ Variante 1: Pasos ============ */
function varPasos(){
  const s = { tema:0, paso:'elegir', sel:null, elecciones:[] };
  return { html:()=>'<div class="app" id="app"></div>', init(stage){
    const app = stage.querySelector('#app');
    const render = () => {
      if (s.tema >= TEMAS.length) { app.innerHTML = pantallaFinal(s); }
      else if (s.paso==='elegir') {
        const t=TEMAS[s.tema];
        app.innerHTML = `${barraSup(s.tema+1)}<main>${cabeceraTema(s.tema)}
          ${t.props.map((p,k)=>cartaHtml(p,k,s.sel)).join('')}
          <p class="pista-tocar">Toca la propuesta que más te convenza.</p></main>
          ${accion(`<button class="btn" data-accion="confirmar" ${s.sel===null?'disabled':''}>${s.sel===null?'Elige una propuesta':`Me quedo con la ${LETRAS[s.sel]}`}</button><button class="link" data-accion="ninguna">Ninguna me convence</button>`)}`;
      } else {
        const p=TEMAS[s.tema].props[s.sel];
        app.innerHTML = `${barraSup(s.tema+1)}<main><span class="opcional">Opcional</span>
          <h1 tabindex="-1" style="margin-top:8px">Has elegido la ${LETRAS[s.sel]}. ¿De qué partido crees que es?</h1>
          ${cartaHtml(p,s.sel,s.sel,true).replace(/<p>.*?<\/p>/,'')}
          <p class="lead">Lo descubrirás al final, cuando acabes los temas.</p>
          <div class="opciones">${PARTIDOS.map((n,j)=>`<button class="opcion" data-apuesta="${j}">${n}</button>`).join('')}</div></main>
          ${accion(`<button class="btn sec" data-accion="saltar">No lo sé, siguiente tema</button><button class="link" data-accion="nomas">No volver a preguntarme</button>`)}`;
      }
      enfocarTitular(app);
    };
    const siguiente = (apuesta) => { s.elecciones.push({k:s.sel, apuesta}); s.tema++; s.paso='elegir'; s.sel=null; render(); };
    app.addEventListener('click', e => {
      const c=e.target.closest('[data-k]'); const a=e.target.closest('[data-accion]'); const ap=e.target.closest('[data-apuesta]');
      if (c && s.paso==='elegir' && !c.classList.contains('estatica')) { s.sel=+c.dataset.k; app.querySelectorAll('.carta').forEach(x=>x.setAttribute('aria-pressed', x===c)); const b=app.querySelector('[data-accion="confirmar"]'); b.disabled=false; b.textContent=`Me quedo con la ${LETRAS[s.sel]}`; return; }
      if (ap) return siguiente(+ap.dataset.apuesta);
      if (!a) return;
      ({ confirmar:()=>{ if(s.preguntar===false) return siguiente(null); s.paso='adivinar'; render(); },
         ninguna:()=>{ s.sel=null; siguiente(null); },
         saltar:()=>siguiente(null),
         nomas:()=>{ s.preguntar=false; siguiente(null); },
         reiniciar:()=>{ Object.assign(s,{tema:0,paso:'elegir',sel:null,elecciones:[],preguntar:true}); render(); } })[a.dataset.accion]?.();
    });
    render();
  }};
}

/* ============ Variante 2: Hoja ============ */
function varHoja(){
  const s = { tema:0, sel:null, elecciones:[] };
  return { html:()=>'<div class="app" id="app"></div><div id="capa"></div>', init(stage){
    const app = stage.querySelector('#app'); const capa = stage.querySelector('#capa');
    const cerrarHoja = (luego) => {
      const h=capa.querySelector('.hoja'), v=capa.querySelector('.velo'); if(!h){ luego?.(); return; }
      h.classList.remove('abierta'); v.classList.remove('abierta');
      setTimeout(()=>{ capa.innerHTML=''; luego?.(); }, matchMedia('(prefers-reduced-motion: reduce)').matches?160:260);
    };
    const abrirHoja = () => {
      const p=TEMAS[s.tema].props[s.sel];
      capa.innerHTML = `<div class="velo" data-accion="cambiar"></div><section class="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-t"><div class="asa" aria-hidden="true"></div>
        <h2 id="hoja-t" tabindex="-1">Has elegido la ${LETRAS[s.sel]}</h2>
        ${cartaHtml(p,s.sel,s.sel,true).replace(/<p>.*?<\/p>/,'').replace(/<span class="cifra">.*?<\/span>/,'')}
        ${s.preguntar===false?'':`<span class="opcional" style="margin-top:4px">Opcional</span>
        <p style="font-weight:700;margin:6px 0 10px">¿De qué partido crees que es? Lo verás al final.</p>
        <div class="opciones">${PARTIDOS.map((n,j)=>`<button class="opcion" data-apuesta="${j}">${n}</button>`).join('')}</div>`}
        <div style="margin-top:14px"><button class="btn ${s.preguntar===false?'':'sec'}" data-accion="saltar">${s.preguntar===false?'Siguiente tema':'No lo sé, siguiente tema'}</button>
        <button class="link" data-accion="cambiar">Cambiar mi elección</button></div></section>`;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ capa.querySelector('.hoja').classList.add('abierta'); capa.querySelector('.velo').classList.add('abierta'); capa.querySelector('#hoja-t').focus({preventScroll:true}); }));
    };
    const render = () => {
      if (s.tema >= TEMAS.length) { app.innerHTML = pantallaFinal(s); }
      else { const t=TEMAS[s.tema];
        app.innerHTML = `${barraSup(s.tema+1)}<main>${cabeceraTema(s.tema)}
          ${t.props.map((p,k)=>cartaHtml(p,k,null)).join('')}
          <p class="pista-tocar">Toca la propuesta que más te convenza.</p></main>
          ${accion(`<button class="btn sec" data-accion="ninguna">Ninguna me convence</button>`)}`; }
      enfocarTitular(app);
    };
    const siguiente = (apuesta) => cerrarHoja(()=>{ s.elecciones.push({k:s.sel, apuesta}); s.tema++; s.sel=null; render(); });
    stage.addEventListener('click', e => {
      const c=e.target.closest('#app [data-k]'); const a=e.target.closest('[data-accion]'); const ap=e.target.closest('[data-apuesta]');
      if (c) { s.sel=+c.dataset.k; c.setAttribute('aria-pressed','true'); abrirHoja(); return; }
      if (ap) return siguiente(+ap.dataset.apuesta);
      if (!a) return;
      ({ ninguna:()=>{ s.sel=null; s.elecciones.push({k:null,apuesta:null}); s.tema++; render(); },
         saltar:()=>siguiente(null),
         cambiar:()=>cerrarHoja(()=>{ app.querySelectorAll('.carta').forEach(x=>x.setAttribute('aria-pressed','false')); s.sel=null; }),
         reiniciar:()=>{ Object.assign(s,{tema:0,sel:null,elecciones:[]}); render(); } })[a.dataset.accion]?.();
    });
    stage.addEventListener('keydown', e => { if (e.key==='Escape' && capa.innerHTML) cerrarHoja(()=>{ app.querySelectorAll('.carta').forEach(x=>x.setAttribute('aria-pressed','false')); }); });
    render();
  }};
}

/* ============ Variante 3: Una a una ============ */
function varUnaAUna(){
  const s = { tema:0, paso:'elegir', ver:0, vistas:new Set([0]), sel:null, elecciones:[] };
  return { html:()=>'<div class="app" id="app"></div>', init(stage){
    const app = stage.querySelector('#app');
    const render = () => {
      if (s.tema >= TEMAS.length) { app.innerHTML = pantallaFinal(s); enfocarTitular(app); return; }
      const t=TEMAS[s.tema], n=t.props.length;
      if (s.paso==='elegir') {
        app.innerHTML = `${barraSup(s.tema+1)}<main>${cabeceraTema(s.tema)}
          <div class="segmento" role="tablist" aria-label="Propuestas" style="--n:${n}">${t.props.map((_,k)=>`<button role="tab" data-ir="${k}" aria-selected="${k===s.ver}">${LETRAS[k]}</button>`).join('')}</div>
          <div class="pista-carrusel" id="pista">${t.props.map((p,k)=>`<article class="diapo" role="tabpanel" aria-label="Propuesta ${LETRAS[k]}"><span class="letra">${LETRAS[k]}</span>${cuerpoProp(p).replace('<h3>','<h3>')}</article>`).join('')}</div>
          <p class="leidas" id="leidas"></p></main>
          ${accion(`<button class="btn" data-accion="confirmar">Me quedo con la ${LETRAS[s.ver]}</button><button class="link" data-accion="ninguna">Ninguna me convence</button>`)}`;
        const pista=app.querySelector('#pista');
        const actualizar = () => {
          app.querySelectorAll('[data-ir]').forEach((b,k)=>b.setAttribute('aria-selected', k===s.ver));
          app.querySelector('[data-accion="confirmar"]').textContent = `Me quedo con la ${LETRAS[s.ver]}`;
          const faltan = n - s.vistas.size;
          app.querySelector('#leidas').textContent = faltan>0 ? `Desliza o toca las letras: te ${faltan===1?'queda 1 propuesta':`quedan ${faltan} propuestas`} por leer.` : `Has leído las ${n}.`;
        };
        let raf=0;
        pista.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ const k=Math.round(pista.scrollLeft/pista.clientWidth); if(k!==s.ver){ s.ver=k; s.vistas.add(k); actualizar(); } }); }, {passive:true});
        if (s.ver) pista.scrollLeft = s.ver*pista.clientWidth;
        actualizar();
      } else {
        const p=t.props[s.sel];
        app.innerHTML = `${barraSup(s.tema+1)}<main><span class="opcional">Opcional</span>
          <h1 tabindex="-1" style="margin-top:8px">Has elegido la ${LETRAS[s.sel]}. ¿De qué partido crees que es?</h1>
          ${cartaHtml(p,s.sel,s.sel,true).replace(/<p>.*?<\/p>/,'')}
          <p class="lead">Lo descubrirás al final, cuando acabes los temas.</p>
          <div class="opciones">${PARTIDOS.map((n,j)=>`<button class="opcion" data-apuesta="${j}">${n}</button>`).join('')}</div></main>
          ${accion(`<button class="btn sec" data-accion="saltar">No lo sé, siguiente tema</button>`)}`;
      }
      enfocarTitular(app);
    };
    const siguiente = (apuesta) => { s.elecciones.push({k:s.sel, apuesta}); Object.assign(s,{tema:s.tema+1,paso:'elegir',ver:0,vistas:new Set([0]),sel:null}); render(); };
    app.addEventListener('click', e => {
      const ir=e.target.closest('[data-ir]'); const a=e.target.closest('[data-accion]'); const ap=e.target.closest('[data-apuesta]');
      if (ir) { const pista=app.querySelector('#pista'); const smooth=!matchMedia('(prefers-reduced-motion: reduce)').matches; pista.scrollTo({left:+ir.dataset.ir*pista.clientWidth, behavior:smooth?'smooth':'auto'}); return; }
      if (ap) return siguiente(+ap.dataset.apuesta);
      if (!a) return;
      ({ confirmar:()=>{ s.sel=s.ver; s.paso='adivinar'; render(); },
         ninguna:()=>{ s.sel=null; siguiente(null); },
         saltar:()=>siguiente(null),
         reiniciar:()=>{ Object.assign(s,{tema:0,paso:'elegir',ver:0,vistas:new Set([0]),sel:null,elecciones:[]}); render(); } })[a.dataset.accion]?.();
    });
    render();
  }};
}

/* ============ Harness (picker wiring, verbatim behaviour) ============ */
const variants = [varPasos, varHoja, varUnaAUna];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  // Fresh node each mount so the previous variant's listeners go with it.
  const old = document.getElementById('stage'); const fresh = old.cloneNode(false); old.replaceWith(fresh);
  requestAnimationFrame(() => { const v = variants[i](); fresh.innerHTML = v.html(); v.init(fresh); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
